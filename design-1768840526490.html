<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to ComplianceOS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-emerald: #10b981;
            --brand-blue: #3b82f6;
            --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
            --ease-in-out-cubic: cubic-bezier(0.65, 0, 0.35, 1);
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .font-display {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* --- Core Cinematic Animations --- */
        
        @keyframes particle-sweep-right {
            0% { transform: translate(-120vw, 10vh) scale(0.5); opacity: 0; filter: blur(5px); }
            30% { opacity: 0.8; filter: blur(2px); }
            60% { transform: translate(10vw, -5vh) scale(1.2); opacity: 0.4; }
            100% { transform: translate(150vw, 20vh) scale(0.5); opacity: 0; }
        }

        @keyframes particle-sweep-left {
            0% { transform: translate(120vw, -10vh) scale(0.5); opacity: 0; filter: blur(5px); }
            30% { opacity: 0.8; filter: blur(2px); }
            60% { transform: translate(-10vw, 5vh) scale(1.2); opacity: 0.4; }
            100% { transform: translate(-150vw, -20vh) scale(0.5); opacity: 0; }
        }

        @keyframes radial-pulse-in {
            0% { transform: scale(3); opacity: 0; border-width: 1px; }
            50% { transform: scale(1); opacity: 0.5; border-width: 4px; }
            100% { transform: scale(0.2); opacity: 0; border-width: 1px; }
        }

        @keyframes surge-aurora {
            0% { background-position: 0% 50%; opacity: 0.2; transform: scale(1); }
            50% { background-position: 100% 50%; opacity: 0.6; transform: scale(1.1); }
            100% { background-position: 0% 50%; opacity: 0.2; transform: scale(1); }
        }

        @keyframes shape-dance {
            0% { transform: translate(0, 0) rotate(0deg) scale(0); opacity: 0; }
            50% { transform: translate(100px, -50px) rotate(180deg) scale(1.5); opacity: 0.3; }
            100% { transform: translate(0, 0) rotate(360deg) scale(0); opacity: 0; }
        }

        @keyframes logo-materialize {
            0% { transform: scale(0) rotate(-45deg); opacity: 0; filter: blur(20px) brightness(3); }
            70% { transform: scale(1.1) rotate(5deg); opacity: 1; filter: blur(0) brightness(1.5); }
            100% { transform: scale(1) rotate(0); opacity: 1; filter: blur(0) brightness(1); }
        }

        @keyframes text-slam-wake {
            0% { transform: scale(5) translateY(-50px); opacity: 0; filter: blur(15px); text-shadow: 0 0 50px rgba(16, 185, 129, 1); }
            80% { transform: scale(0.95) translateY(5px); opacity: 1; filter: blur(0); }
            100% { transform: scale(1) translateY(0); opacity: 1; text-shadow: 0 0 0px transparent; }
        }

        @keyframes draw-underline-fast {
            0% { width: 0; opacity: 0; left: 50%; }
            100% { width: 100%; opacity: 1; left: 0; }
        }

        @keyframes gravitational-pulse {
            0% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4), 0 0 0 0px rgba(16, 185, 129, 0.2); }
            50% { box-shadow: 0 0 50px rgba(16, 185, 129, 0.8), 0 0 0 20px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.4), 0 0 0 0px rgba(16, 185, 129, 0.2); }
        }

        @keyframes portal-exit {
            0% { transform: scale(1); filter: blur(0); opacity: 1; }
            100% { transform: scale(15); filter: blur(80px); opacity: 0; }
        }

        /* --- Utility Classes for Storm --- */
        .layer-bg { background-color: #010409; }

        .aurora-surge {
            background: linear-gradient(-45deg, #020617, #064e3b, #1e3a8a, #020617);
            background-size: 400% 400%;
            animation: surge-aurora 4s ease-in-out infinite;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .shape-element {
            position: absolute;
            border: 2px solid rgba(16, 185, 129, 0.2);
            opacity: 0;
        }

        .ring-radial {
            position: absolute;
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 50%;
            width: 800px;
            height: 800px;
            pointer-events: none;
        }

        .portal-active {
            animation: portal-exit 1.2s var(--ease-in-out-cubic) forwards;
        }
    </style>
</head>
<body>
    <div id="app-root" class="relative w-screen h-screen flex items-center justify-center overflow-hidden layer-bg">
        
        <!-- Background Surge Layer -->
        <div class="absolute inset-0 aurora-surge"></div>
        <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/carbon-fibre.png')] opacity-10"></div>
        <div class="absolute inset-0 grid-overlay" style="background-image: linear-gradient(rgba(16,185,129,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(16,185,129,0.03) 1px, transparent 1px); background-size: 60px 60px;"></div>

        <!-- 1) PARTICLE STORM SWEEP LAYER -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <!-- Fast Emerald Right Sweeps -->
            <div class="particle bg-emerald-500 w-2 h-2" style="top: 20%; left: -10%; animation: particle-sweep-right 1.5s var(--ease-out-expo) infinite;"></div>
            <div class="particle bg-emerald-400 w-1 h-1 blur-sm" style="top: 40%; left: -15%; animation: particle-sweep-right 1.8s var(--ease-out-expo) 0.2s infinite;"></div>
            <div class="particle bg-emerald-600 w-3 h-3" style="top: 70%; left: -5%; animation: particle-sweep-right 1.2s var(--ease-out-expo) 0.1s infinite;"></div>
            
            <!-- Medium Blue Left Sweeps -->
            <div class="particle bg-blue-500 w-2 h-2" style="top: 30%; right: -10%; animation: particle-sweep-left 2s var(--ease-out-expo) 0.3s infinite;"></div>
            <div class="particle bg-blue-400 w-4 h-4 blur-md" style="top: 60%; right: -15%; animation: particle-sweep-left 2.5s var(--ease-out-expo) 0.5s infinite;"></div>
            <div class="particle bg-white w-1 h-1" style="top: 50%; right: -5%; animation: particle-sweep-left 1.5s var(--ease-out-expo) 0.1s infinite;"></div>
        </div>

        <!-- 2) GEOMETRIC SHAPE DANCE -->
        <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
            <div class="shape-element w-24 h-24 rounded-lg border-emerald-500/30" style="animation: shape-dance 4s var(--ease-in-out-cubic) 0.5s infinite;"></div>
            <div class="shape-element w-32 h-32 rounded-full border-blue-500/20" style="animation: shape-dance 5s var(--ease-in-out-cubic) 0.8s infinite;"></div>
            <div class="shape-element w-16 h-16 rotate-45 border-white/10" style="animation: shape-dance 3.5s var(--ease-in-out-cubic) 1.2s infinite;"></div>
        </div>

        <!-- 4) RADIAL CONVERGENCE -->
        <div class="absolute inset-0 pointer-events-none flex items-center justify-center">
            <div class="ring-radial" style="animation: radial-pulse-in 2s var(--ease-out-expo) 1s infinite;"></div>
            <div class="ring-radial border-emerald-500/20" style="animation: radial-pulse-in 2.5s var(--ease-out-expo) 1.5s infinite;"></div>
        </div>

        <!-- Main Branding Container -->
        <div class="relative z-10 flex flex-col items-center text-center">
            
            <!-- 5) LOGO EMERGENCE FROM MOTION -->
            <div class="mb-10 relative">
                <!-- Orbiting Particles around logo -->
                <div class="absolute inset-0 pointer-events-none">
                    <div class="absolute w-2 h-2 bg-emerald-400 rounded-full animate-[spin_2s_linear_infinite]" style="transform-origin: 60px 60px; top: -10px; left: -10px;"></div>
                    <div class="absolute w-2 h-2 bg-blue-400 rounded-full animate-[spin_3s_linear_infinite_reverse]" style="transform-origin: -20px -20px; bottom: -10px; right: -10px;"></div>
                </div>
                
                <div class="w-28 h-28 bg-gradient-to-br from-emerald-400 via-emerald-600 to-blue-700 rounded-3xl flex items-center justify-center shadow-[0_0_60px_rgba(16,185,129,0.4)] opacity-0 animate-[logo-materialize_1.2s_var(--ease-out-expo)_1.5s_forwards]">
                    <iconify-icon icon="lucide:layers" class="text-white text-6xl"></iconify-icon>
                </div>
            </div>

            <!-- 6) TEXT SLAM WITH WAKE EFFECT -->
            <div class="space-y-6">
                <div class="relative">
                    <h1 class="font-display text-8xl font-black text-white tracking-tight opacity-0 animate-[text-slam-wake_0.8s_var(--ease-out-expo)_1.8s_forwards]">
                        Compliance<span class="text-emerald-500">OS</span>
                    </h1>
                    <!-- Wake/Ripple effect elements -->
                    <div class="absolute inset-0 bg-emerald-500/20 blur-2xl opacity-0 animate-[pulse_1s_ease-out_2s_1] rounded-full scale-x-150"></div>
                </div>
                
                <div class="relative h-[3px] overflow-hidden">
                    <div class="absolute h-full bg-gradient-to-r from-transparent via-emerald-400 to-transparent opacity-0 animate-[draw-underline-fast_0.6s_var(--ease-out-expo)_2.2s_forwards]"></div>
                </div>

                <p class="text-slate-400 font-semibold text-xl tracking-[0.3em] uppercase opacity-0 animate-[fadeInUp_1s_var(--ease-out-expo)_2.4s_forwards]">
                    Modern Compliance Management System
                </p>
            </div>

            <!-- 7) BUTTON PULSE WITH ENERGY -->
            <div class="mt-16 opacity-0 animate-[fadeIn_0.8s_ease-out_2.8s_forwards]">
                <button 
                    id="cta-launch-btn"
                    onclick="launchDashboard()"
                    class="group relative px-12 py-5 bg-emerald-600 hover:bg-emerald-500 text-white text-lg font-bold rounded-full transition-all duration-300 transform hover:scale-105 active:scale-95 shadow-lg animate-[gravitational-pulse_3s_infinite_2.8s]"
                >
                    <span class="relative z-10 flex items-center gap-3">
                        Enter Dashboard
                        <iconify-icon icon="lucide:zap" class="group-hover:translate-x-1 group-hover:scale-110 transition-transform text-xl"></iconify-icon>
                    </span>
                    <!-- Button Core Glow -->
                    <div class="absolute inset-0 bg-emerald-400/40 rounded-full blur-xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                </button>
            </div>
        </div>

        <!-- Screen-space Scanline Overlay -->
        <div class="absolute inset-0 pointer-events-none overflow-hidden opacity-20">
            <div class="w-full h-[2px] bg-blue-400/50 absolute top-0 animate-[scanline_8s_linear_infinite]"></div>
        </div>
    </div>

    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scanline {
            0% { top: -10%; }
            100% { top: 110%; }
        }
    </style>

    <script>
        function launchDashboard() {
            const root = document.getElementById('app-root');
            
            // Add the portal activation effect
            root.classList.add('portal-active');
            
            // Simulate navigation after dramatic portal pull
            setTimeout(() => {
                document.body.style.backgroundColor = '#f8fafc';
                root.innerHTML = `<div class="min-h-screen bg-slate-50 w-full p-8 flex flex-col">
                    <nav class="flex justify-between items-center mb-12 animate-[fadeIn_0.5s_ease-out]">
                        <div class="flex items-center gap-3">
                             <div class="w-10 h-10 bg-emerald-600 rounded-lg flex items-center justify-center shadow-md">
                                <iconify-icon icon="lucide:layers" class="text-white text-xl"></iconify-icon>
                             </div>
                             <span class="font-bold text-xl text-slate-900">ComplianceOS</span>
                        </div>
                        <div class="flex items-center gap-6">
                            <iconify-icon icon="lucide:search" class="text-slate-400 text-xl cursor-pointer hover:text-emerald-600 transition-colors" id="nav-search-btn"></iconify-icon>
                            <div class="relative">
                                <iconify-icon icon="lucide:bell" class="text-slate-400 text-xl cursor-pointer hover:text-emerald-600 transition-colors" id="nav-bell-btn"></iconify-icon>
                                <span class="absolute -top-1 -right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                            </div>
                            <div class="w-10 h-10 rounded-full bg-slate-200 border-2 border-white shadow-sm overflow-hidden">
                                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="avatar">
                            </div>
                        </div>
                    </nav>
                    <header class="mb-8 animate-[fadeInUp_0.6s_ease-out_0.1s_forwards] opacity-0">
                        <h1 class="text-3xl font-bold text-slate-900 tracking-tight">Dashboard Overview</h1>
                        <p class="text-slate-500">Welcome back, administrator. Systems are operational.</p>
                    </header>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 animate-[fadeInUp_0.6s_ease-out_0.2s_forwards] opacity-0">
                        <div class="p-6 bg-white rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow cursor-pointer">
                            <div class="text-slate-400 text-xs font-bold mb-2 tracking-widest uppercase">COMPLIANCE SCORE</div>
                            <div class="text-5xl font-extrabold text-emerald-600">98.4%</div>
                            <div class="mt-4 w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                                <div class="bg-emerald-500 h-full w-[98%] rounded-full animate-[draw-line_1.5s_ease-out]"></div>
                            </div>
                        </div>
                        <div class="p-6 bg-white rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow cursor-pointer">
                            <div class="text-slate-400 text-xs font-bold mb-2 tracking-widest uppercase">ACTIVE AUDITS</div>
                            <div class="text-5xl font-extrabold text-slate-900">12</div>
                            <div class="mt-4 flex gap-2">
                                <span class="px-2 py-1 bg-red-50 text-red-600 text-[10px] font-bold rounded uppercase">4 Critical</span>
                                <span class="px-2 py-1 bg-blue-50 text-blue-600 text-[10px] font-bold rounded uppercase">8 In-Progress</span>
                            </div>
                        </div>
                        <div class="p-6 bg-white rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow cursor-pointer">
                            <div class="text-slate-400 text-xs font-bold mb-2 tracking-widest uppercase">NEW TASKS</div>
                            <div class="text-5xl font-extrabold text-slate-900">05</div>
                            <div class="mt-4 text-slate-400 text-xs font-medium italic">Requires attention before EOD</div>
                        </div>
                    </div>
                    
                    <div class="mt-8 grid grid-cols-1 gap-6 animate-[fadeInUp_0.8s_ease-out_0.3s_forwards] opacity-0">
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8">
                             <div class="flex justify-between items-center mb-6">
                                <h2 class="text-xl font-bold text-slate-900">Activity Feed</h2>
                                <a href="#" id="view-all-activity" class="text-emerald-600 text-sm font-semibold hover:underline">View Detailed Logs</a>
                             </div>
                             <div class="space-y-6">
                                 <div class="flex items-center gap-4">
                                     <div class="w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center">
                                         <iconify-icon icon="lucide:file-check" class="text-emerald-600"></iconify-icon>
                                     </div>
                                     <div>
                                         <p class="text-sm font-bold text-slate-900">Policy Framework Updated</p>
                                         <p class="text-xs text-slate-500">24 minutes ago by System</p>
                                     </div>
                                 </div>
                                 <div class="flex items-center gap-4 opacity-75">
                                     <div class="w-10 h-10 rounded-full bg-blue-50 flex items-center justify-center">
                                         <iconify-icon icon="lucide:user-plus" class="text-blue-600"></iconify-icon>
                                     </div>
                                     <div>
                                         <p class="text-sm font-bold text-slate-900">New Auditor Assigned</p>
                                         <p class="text-xs text-slate-500">1 hour ago by Sarah Chen</p>
                                     </div>
                                 </div>
                             </div>
                        </div>
                    </div>
                </div>`;
            }, 1100);
        }
    </script>
</body>
</html>
